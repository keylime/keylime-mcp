---
name: go-test

"on":
  push:
    paths-ignore:
      - '**.md'
      - '**.sh'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.sh'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install test dependencies
        run: dnf -y install golang nodejs

      - name: Run tests
        run: go test ./internal/... ./cmd/... -race -count=1

      - name: Run web tests
        run: node --test internal/web/*.test.cjs

    container:
      image: fedora:latest
      env:
        GOPATH: /root/go
        PATH: /root/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
